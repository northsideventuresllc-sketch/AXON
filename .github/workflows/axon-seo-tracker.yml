name: AXON SEO Tracker

# Schedule moved to mac mini cron manifest (AXON-SEO-Tracker) on 2026-09-02 (Decision #1699).
# Was: cron '30 9 * * *'. Runs: node scripts/axon-seo-tracker.mjs.
# workflow_dispatch below still fires it on demand.

# REBUILT 2026-08-26 (JB direct correction). Does real public SEO signal now
# via SerpApi + Gemini/Anthropic — does NOT wait on Search Console or other
# first-party SEO credentials. Nightly + manual trigger, enabled.
on:
  workflow_dispatch: {}

concurrency:
  group: axon-seo-tracker
  cancel-in-progress: false

jobs:
  track:
    name: AXON — SEO tracker (real public search signal)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run per-venture SEO search + synthesis
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/axon-seo-tracker.mjs

      - name: Report failure
        if: failure()
        run: echo "AXON SEO tracker failed — check Actions logs"
