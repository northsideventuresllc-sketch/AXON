name: AXON Backlog Janitor

# Schedule moved to mac mini cron manifest (AXON Backlog Janitor) on 2026-09-02 (Decision #1699).
# Was: cron '30 9 * * *'. Runs: node scripts/backlog-janitor.mjs.
# workflow_dispatch below still fires it on demand.

# Nightly sweep of agent_dispatch for stale queued/needs_context tickets
# NOT owned by BUILD or SENSEI (those need a real human-in-the-loop Claude
# Code session, this job never touches their rows). Built 2026-08-26.
#
# SAFETY: registered active=false in nvg_agent_routines / axon_cron_jobs
# pending JB/EXEC review — this workflow exists in the PR but the job
# itself no-ops via lib/axon-cron-guard.mjs until the axon_cron_jobs row
# for "axon-backlog-janitor" is flipped to enabled=true. Do not flip that
# row without EXEC/JB sign-off on this PR.

on:
  workflow_dispatch: {}

concurrency:
  group: axon-backlog-janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Backlog Janitor
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/backlog-janitor.mjs

      - name: Report failure
        if: failure()
        run: echo "❌ AXON Backlog Janitor failed — check Actions logs"
