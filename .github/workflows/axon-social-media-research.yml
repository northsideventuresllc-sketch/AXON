name: AXON Social Media Research

# REBUILT 2026-08-26 (JB direct correction). Does real external/public
# research now via SerpApi + Gemini/Anthropic — does NOT wait on JB's own
# social account credentials. Nightly + manual trigger, enabled.
on:
  schedule:
    - cron: '0 9 * * *'  # nightly, 09:00 UTC
  workflow_dispatch: {}

concurrency:
  group: axon-social-media-research
  cancel-in-progress: false

jobs:
  research:
    name: AXON — Social media research (real external/public research)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run per-venture external research + synthesis
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/axon-social-media-research.mjs

      - name: Report failure
        if: failure()
        run: echo "AXON social media research failed — check Actions logs"
