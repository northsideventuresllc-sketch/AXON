name: AXON Telegram Poll

# RETIRED 2026-08-26 (housekeeping PR): this job's automatic 15-min schedule
# is removed. axon_cron_jobs id "axon-telegram-poll" has been enabled=false
# since 2026-08-10 (real, verified: 619 historical runs, last 3 all ok before
# retirement), so the script already no-op'd via lib/axon-cron-guard.mjs on
# every one of those scheduled fires — this just stops burning CI minutes on
# a fire that was already a no-op. workflow_dispatch / repository_dispatch
# stay live so it can still be fired on demand (e.g. if the webhook ever
# needs a manual fallback poll again).
on:
  # schedule:
  #   - cron: '*/15 * * * *'  # retired 2026-08-26 — see comment above
  workflow_dispatch:
  repository_dispatch:
    types: [axon-telegram-poll]

concurrency:
  group: axon-telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    name: AXON — Telegram chat + approve
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Poll Telegram commands
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          AXON_WEBHOOK_URL: ${{ secrets.AXON_WEBHOOK_URL }}
        run: node scripts/axon-telegram-poll.mjs
