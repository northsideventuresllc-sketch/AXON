name: AXON Sensei Daily Report

# SENSEI daily job — 3-part check, per JB order 2026-08-24 (Decision #1362):
#   1. Confirm the RunPod serverless endpoint AXON's build ships through is reachable and
#      has healthy workers (not just "workflow ran").
#   2. Confirm AXON's cron jobs (axon_cron_jobs table) are healthy — no silent failures.
#   3. Deliver the AXON report (Slack #agent-ops).
#
# DRAFTED BY ARCEUS 2026-08-24, RunPod check rewired 2026-08-25 to match the real
# ni_platform_secrets shape (RunPod Serverless Endpoints, not the Pods API ARCEUS's
# scaffold assumed). See sensei-daily-report.mjs for the open question this still leaves.

on:
  schedule:
    # 09:00 UTC daily — same slot as the retired daily-axon-report job (axon_cron_jobs id
    # "daily-axon-report", disabled since 2026-08-13) and axon-sensei-report skill's stated cadence.
    - cron: '0 9 * * *'
  workflow_dispatch: {} # allow manual on-demand fire for testing, same posture as ARCEUS itself

concurrency:
  group: sensei-daily-report
  cancel-in-progress: false

jobs:
  sensei-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run SENSEI daily report
        id: sensei
        env:
          SUPABASE_URL: https://kxijunwgbrlfzvgkhklo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # RunPod Serverless Endpoint secrets — matches the real ni_platform_secrets shape
          # (RUNPOD_AXON_V1_ENDPOINT_ID / RUNPOD_AXON_V1_KEY), not RunPod's older Pods API.
          # If these secrets are not yet registered on this repo, the script self-reports
          # NEEDS_CONFIG rather than faking a pass — see script header for the fallback.
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_AXON_V1_KEY || secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_AXON_V1_ENDPOINT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_AGENT_OPS_CHANNEL: C0BQMTYMNRH
        run: node .github/scripts/sensei-daily-report.mjs

      - name: Fail workflow if SENSEI found a real problem
        if: steps.sensei.outputs.status == 'fail'
        run: |
          echo "SENSEI daily report surfaced a failing check — see step output / Slack #agent-ops."
          exit 1
